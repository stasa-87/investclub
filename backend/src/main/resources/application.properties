spring.application.name=investclub-backend
server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.override-with-generic-response=false

# PostgreSQL datasource (production-safe, env-driven)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/investclub}
spring.datasource.username=${DB_USER:investclub}
spring.datasource.password=${DB_PASSWORD:investclub}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT config
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-key-change-me-12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Profile photo storage
app.upload-dir=${APP_UPLOAD_DIR:/app/uploads}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8081}
